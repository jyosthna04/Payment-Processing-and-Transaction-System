<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Payment - Payment System Preview</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Payment Processing System</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="payments.html">Payments</a>
            <a href="create-payment.html" class="active">New Payment</a>
        </div>
    </nav>

    <div class="container">
        <h1>Create New Payment</h1>
        <p class="subtitle">Enter the payment details below</p>

        <form action="#" method="post" class="payment-form">
            <div class="form-group">
                <label for="customerName">Customer Name</label>
                <input type="text" id="customerName" name="customerName" placeholder="John Doe"/>
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="100.00"/>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod" name="paymentMethod">
                    <option value="" selected disabled>Select a method</option>
                    <option value="UPI">UPI</option>
                    <option value="CARD">CARD</option>
                    <option value="CASH">CASH</option>
                </select>
            </div>

            <div class="form-actions">
                <a href="payments.html" class="btn">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Payment</button>
            </div>
        </form>
    </div>
</body>
</html>
