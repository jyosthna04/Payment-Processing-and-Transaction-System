<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard - Payment System Preview</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Payment Processing System</div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="payments.html">Payments</a>
            <a href="create-payment.html" class="btn-nav">New Payment</a>
        </div>
    </nav>

    <div class="container">
        <h1>Dashboard</h1>
        <p class="subtitle">Overview of all payment activity</p>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Payments</span>
                <span class="stat-value">5</span>
            </div>
            <div class="stat-card stat-success">
                <span class="stat-label">Successful Payments</span>
                <span class="stat-value">2</span>
            </div>
            <div class="stat-card stat-danger">
                <span class="stat-label">Failed Payments</span>
                <span class="stat-value">1</span>
            </div>
            <div class="stat-card stat-primary">
                <span class="stat-label">Total Amount</span>
                <span class="stat-value">$1,250.00</span>
            </div>
        </div>

        <div class="action-bar">
            <a href="payments.html" class="btn">View All Payments</a>
            <a href="create-payment.html" class="btn btn-primary">Create New Payment</a>
        </div>
    </div>
</body>
</html>
