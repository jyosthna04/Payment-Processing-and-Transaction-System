<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payment Details - Payment System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Payment Processing System</div>
        <div class="nav-links">
            <a th:href="@{/}">Dashboard</a>
            <a th:href="@{/payments}">Payments</a>
            <a th:href="@{/payments/new}" class="btn-nav">New Payment</a>
        </div>
    </nav>

    <div class="container">
        <h1>Payment Details</h1>
        <p class="subtitle">Payment #<span th:text="${payment.id}">1</span></p>

        <div class="detail-card">
            <div class="detail-row">
                <span class="detail-label">Payment ID</span>
                <span class="detail-value" th:text="${payment.id}">1</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Customer Name</span>
                <span class="detail-value" th:text="${payment.customerName}">John Doe</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount</span>
                <span class="detail-value">$<span th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}">0.00</span></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment Method</span>
                <span class="detail-value" th:text="${payment.paymentMethod}">UPI</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value">
                    <span class="badge" th:text="${payment.status}"
                          th:classappend="${payment.status.name() == 'SUCCESS'} ? 'badge-success' : (${payment.status.name() == 'FAILED'} ? 'badge-danger' : (${payment.status.name() == 'REFUNDED'} ? 'badge-warning' : 'badge-pending'))">
                        PENDING
                    </span>
                </span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment Date</span>
                <span class="detail-value" th:text="${#temporals.format(payment.paymentDate, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</span>
            </div>
        </div>

        <div class="action-bar">
            <a th:href="@{/payments}" class="btn">Back to List</a>

            <form th:if="${payment.status.name() == 'PENDING'}" th:action="@{'/payments/' + ${payment.id} + '/process'}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-primary">Process Payment</button>
            </form>

            <form th:if="${payment.status.name() == 'SUCCESS'}" th:action="@{'/payments/' + ${payment.id} + '/refund'}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-warning">Refund Payment</button>
            </form>
        </div>
    </div>
</body>
</html>
