<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Payment - Payment System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Payment Processing System</div>
        <div class="nav-links">
            <a th:href="@{/}">Dashboard</a>
            <a th:href="@{/payments}">Payments</a>
            <a th:href="@{/payments/new}" class="active">New Payment</a>
        </div>
    </nav>

    <div class="container">
        <h1>Create New Payment</h1>
        <p class="subtitle">Enter the payment details below</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}">
            Error message
        </div>

        <form th:action="@{/payments}" method="post" class="payment-form">
            <div class="form-group">
                <label for="customerName">Customer Name</label>
                <input type="text" id="customerName" name="customerName" placeholder="John Doe" required/>
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="100.00" required/>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod" name="paymentMethod" required>
                    <option value="" selected disabled>Select a method</option>
                    <option th:each="m : ${methods}" th:value="${m}" th:text="${m}">UPI</option>
                </select>
            </div>

            <div class="form-actions">
                <a th:href="@{/payments}" class="btn">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Payment</button>
            </div>
        </form>
    </div>
</body>
</html>
