<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard - Payment System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Payment Processing System</div>
        <div class="nav-links">
            <a th:href="@{/}" class="active">Dashboard</a>
            <a th:href="@{/payments}">Payments</a>
            <a th:href="@{/payments/new}" class="btn-nav">New Payment</a>
        </div>
    </nav>

    <div class="container">
        <h1>Dashboard</h1>
        <p class="subtitle">Overview of all payment activity</p>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Payments</span>
                <span class="stat-value" th:text="${totalPayments}">0</span>
            </div>
            <div class="stat-card stat-success">
                <span class="stat-label">Successful Payments</span>
                <span class="stat-value" th:text="${successfulPayments}">0</span>
            </div>
            <div class="stat-card stat-danger">
                <span class="stat-label">Failed Payments</span>
                <span class="stat-value" th:text="${failedPayments}">0</span>
            </div>
            <div class="stat-card stat-primary">
                <span class="stat-label">Total Amount</span>
                <span class="stat-value">$<span th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}">0.00</span></span>
            </div>
        </div>

        <div class="action-bar">
            <a th:href="@{/payments}" class="btn">View All Payments</a>
            <a th:href="@{/payments/new}" class="btn btn-primary">Create New Payment</a>
        </div>
    </div>
</body>
</html>
